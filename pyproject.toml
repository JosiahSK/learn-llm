[project]
name = "learn-llm"
version = "0.1.0"
description = "A comprehensive, hands-on LLM Learning Academy — from fundamentals to real applications"
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.11"

authors = [
    { name = "JosiahSK", url = "https://github.com/JosiahSK" },
]

keywords = [
    "llm",
    "langchain",
    "generative-ai",
    "rag",
    "embeddings",
    "gemini",
    "openai",
    "learning",
]

classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Education",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Education",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]

dependencies = [
    "python-dotenv>=1.0.0",
    "httpx>=0.27.0",
    "google-genai>=1.0.0",
    "openai>=1.50.0",
    "langchain>=0.3.0",
    "langchain-core>=0.3.0",
    "langchain-openai>=0.2.0",
    "langchain-google-genai>=2.0.0",
    "langchain-community>=0.3.0",
    "langgraph>=0.2.0",
    "tiktoken>=0.8.0",
    "pypdf>=4.0.0",
    "chromadb>=0.5.0",
    "numpy>=1.26.0",
    "matplotlib>=3.9.0",
    "scikit-learn>=1.5.0",
    "pydantic>=2.7.0",
]

[project.optional-dependencies]
test = [
    "pytest>=8.0.0",
    "pytest-asyncio>=0.24.0",
    "pytest-mock>=3.14.0",
]
local = [
    "sentence-transformers>=3.0.0",
]

[project.urls]
Repository = "https://github.com/JosiahSK/learn-llm"
Issues = "https://github.com/JosiahSK/learn-llm/issues"

[build-system]
requires = ["setuptools>=68.0"]
build-backend = "setuptools.backends.legacy:build"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
    "requires_api: marks tests that need real API credentials",
    "requires_ollama: marks tests that need Ollama running locally",
    "slow: marks slow tests",
]

[tool.ruff]
line-length = 100
target-version = "py311"
